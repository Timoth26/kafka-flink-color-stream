name: Verify Golang Environment

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-golang:
    name: Build & Test Golang
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: publisher
          version: v2.12.2

      - name: Build Publisher
        working-directory: ./publisher
        run: |
          go mod tidy
          go build -v -o publisher-bin main.go