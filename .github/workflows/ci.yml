name: Verify Environment

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-golang:
    name: Build & Test Golang - ${{ matrix.app }}
    runs-on: ubuntu-26.04
    
    strategy:
      fail-fast: false
      matrix:
        app: [publisher, subscriber]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ matrix.app }}
          version: v2.12.2

      - name: Build ${{ matrix.app }}
        working-directory: ./${{ matrix.app }}
        run: |
          go mod tidy
          go build -v -o ${{ matrix.app }}-bin main.go
  
  python-lint:
    name: Lint Python
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Linter
        working-directory: ./flink-job
        run: |
          flake8 . --max-line-length=88 --statistics